[package]
name = "sis-verifier"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "crates/sis-verifier/src/lib.rs"

[[bin]]
name = "sis-verify"
path = "crates/sis-verifier/src/main.rs"

[[bin]]
name = "sis-search"
path = "crates/sis-verifier/src/search_main.rs"

[[bin]]
name = "sis-lab"
path = "crates/sis-verifier/src/lab_main.rs"

[[bin]]
name = "magnet-chain"
path = "crates/sis-verifier/src/chain_main.rs"

[[bin]]
name = "sis-column"
path = "crates/sis-verifier/src/column_main.rs"

[[bin]]
name = "sis-coeff"
path = "crates/sis-verifier/src/coeff_main.rs"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
